name: Create AsistentIno Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, npr. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET version
        shell: pwsh
        run: |
          dotnet --info

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\AsistentIno.sln --force

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\AsistentIno\AsistentIno.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=${{ inputs.version }} `
            -o .\publish

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $iss = Join-Path $env:GITHUB_WORKSPACE "installer\AsistentIno.iss"
          
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler nije pronadjen: $iscc"
          }

          & $iscc `
            "/DMyAppVersion=${{ inputs.version }}" `
            ".\installer\AsistentIno.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup build failed."
          }

      - name: Create public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $installer = ".\installer\output\AsistentIno-Setup-$version.exe"

          if (-not (Test-Path $installer)) {
            throw "Installer nije pronadjen: $installer"
          }

          gh release create "v$version" `
            "$installer" `
            --repo gasha66pm/AsistentIno-Releases `
            --title "AsistentIno $version" `
            --generate-notes
