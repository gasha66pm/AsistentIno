name: Create AsistentIno Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, npr. 1.0.0"
        required: true
        default: "1.0.0"

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Show .NET version
        shell: pwsh
        run: |
          dotnet --info

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\AsistentIno.sln --force

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish .\AsistentIno\AsistentIno.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:Version=${{ inputs.version }} `
            -o .\publish

      - name: Create ZIP
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $zip = ".\AsistentIno-$version-win-x64.zip"

          Compress-Archive `
            -Path ".\publish\*" `
            -DestinationPath $zip `
            -Force

          if (-not (Test-Path $zip)) {
            throw "ZIP nije kreiran: $zip"
          }

      - name: Create public GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          $version = "${{ inputs.version }}"
          $zip = ".\AsistentIno-$version-win-x64.zip"

          if (-not (Test-Path $zip)) {
            throw "ZIP nije pronadjen: $zip"
          }

          gh release create "v$version" `
            "$zip" `
            --repo gasha66pm/AsistentIno-Releases `
            --title "AsistentIno $version" `
            --generate-notes
